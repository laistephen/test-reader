name: Build Python EXE

on:
  push:
    branches: [ main, master ]  # 當你推送程式碼到 main 或 master 分支時自動觸發
  workflow_dispatch:           # 允許手動點擊按鈕觸發編譯

jobs:
  build:
    runs-on: windows-latest   # 在 Windows 環境下打包成 .exe

    steps:
    - name: 讀取專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝打包工具 (PyInstaller)
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 使用 PyInstaller 打包成獨立 .exe
      run: |
        pyinstaller --noconsole --onefile --name="ModernLookbook" reader.py

    - name: 上傳編譯好的 .exe 檔案供下載
      uses: actions/upload-artifact@v4
      with:
        name: ModernLookbook-EXE
        path: dist/ModernLookbook.exe
